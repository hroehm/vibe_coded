    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .font-mono { font-family: 'Fira Code', monospace; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .animate-slide-in { animation: slideInRight 0.3s ease-out forwards; }

        /* Cyber UI Elements */
        .cyber-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
        .cyber-button { transition: all 0.2s; position: relative; overflow: hidden; }
        .cyber-button:active { transform: scale(0.98); }
        .tab-active { border-bottom-width: 2px; }
        .terminal-input:focus { outline: none; }
        
        /* Drag and Drop Styles */
        .draggable { cursor: grab; }
        .draggable:active { cursor: grabbing; }
        .dropzone { transition: background-color 0.2s; }
        .dropzone.dragover { background-color: rgba(16, 185, 129, 0.2); border-color: #10b981; }
    </style>
</head>

            '4.1.1': { maxScore: 0, passed: false },
            '4.2.1': { maxScore: 0, passed: false },
            '4.3.1': { maxScore: 0, passed: false },
            '4.3.2': { maxScore: 0, passed: false },

            '4.3.4': { maxScore: 0, passed: false },
            '4.4.1': { maxScore: 0, passed: false }
        };

        // UI Helpers
        function toggleTile(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById(id + '-icon');
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                icon.classList.replace('fa-chevron-down', 'fa-chevron-up');
            } else {
                el.classList.add('hidden');
                icon.classList.replace('fa-chevron-up', 'fa-chevron-down');
            }
        }

        function showModal(title, message, type = 'info') {
            const modal = document.getElementById('custom-modal');
            const modalContent = document.getElementById('custom-modal-content');
            const titleEl = document.getElementById('modal-title');
            const messageEl = document.getElementById('modal-message');
            const iconEl = document.getElementById('modal-icon');

            titleEl.innerText = title;
            messageEl.innerText = message;
            iconEl.className = 'w-10 h-10 rounded-full flex items-center justify-center mr-3 text-xl shrink-0'; 
            
            if (type === 'success') {
                iconEl.classList.add('bg-emerald-900/50', 'text-emerald-400', 'border', 'border-emerald-500/50');
                iconEl.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else if (type === 'error') {
                iconEl.classList.add('bg-rose-900/50', 'text-rose-400', 'border', 'border-rose-500/50');
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                iconEl.classList.add('bg-blue-900/50', 'text-blue-400', 'border', 'border-blue-500/50');
                iconEl.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
            }

            modal.classList.remove('hidden');
            void modal.offsetWidth; // trigger reflow
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const modalContent = document.getElementById('custom-modal-content');
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        const moduleData = {
            '1.4.1': {
                title: '1.4.1 Troubleshooting Methodology',
                learnHtml: `
                    <div class="animate-fade-in space-y-6">
                        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-md">
                            <h2 class="text-2xl font-bold text-emerald-400 mb-4">The Troubleshooting Methodology</h2>
                            <p class="text-slate-300 mb-4">Troubleshooting is a core skill for all IT roles. It is not about memorizing fixes; it is about understanding systems and solving problems logically. A structured methodology prevents you from causing new problems while trying to fix old ones.</p>
                            <div class="grid gap-4 md:grid-cols-2">
                                <div class="bg-slate-900 p-4 rounded-lg border-l-4 border-emerald-500">
                                    <h3 class="font-bold text-white mb-2">1. Identify the Problem</h3>
                                    <p class="text-sm text-slate-400">Gather info, note symptoms, ask questions, define the problem clearly, and replicate the issue.</p>
                                </div>
                                <div class="bg-slate-900 p-4 rounded-lg border-l-4 border-emerald-500">
                                    <h3 class="font-bold text-white mb-2">2. Establish a Theory of Probable Cause</h3>
                                    <p class="text-sm text-slate-400">Research the knowledge base. Question the obvious first. Develop a prioritized list of potential causes.</p>
                                </div>
                                <div class="bg-slate-900 p-4 rounded-lg border-l-4 border-emerald-500">
                                    <h3 class="font-bold text-white mb-2">3. Test the Theory</h3>
                                    <p class="text-sm text-slate-400">Test one variable at a time. If the theory is disproved, test the next one. Escalate if unresolved.</p>
                                </div>
                                <div class="bg-slate-900 p-4 rounded-lg border-l-4 border-emerald-500">
                                    <h3 class="font-bold text-white mb-2">4. Establish a Plan of Action & Implement</h3>
                                    <p class="text-sm text-slate-400">Create a clear plan. Back up data first to mitigate risks. Implement the solution.</p>
                                </div>
                                <div class="bg-slate-900 p-4 rounded-lg border-l-4 border-emerald-500">
                                    <h3 class="font-bold text-white mb-2">5. Verify Functionality & Implement Preventive Measures</h3>
                                    <p class="text-sm text-slate-400">Test the system thoroughly. Ensure no new issues arose. Address vulnerabilities to prevent recurrence.</p>
                                </div>
                                <div class="bg-slate-900 p-4 rounded-lg border-l-4 border-emerald-500">
                                    <h3 class="font-bold text-white mb-2">6. Document Findings</h3>
                                    <p class="text-sm text-slate-400">Record the process, problem, and solution for future reference and team training.</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-md">
                            <button onclick="toggleTile('rem-1.4.1')" class="w-full flex justify-between items-center p-4 bg-slate-700/50 hover:bg-slate-700 transition-colors text-left focus:outline-none">
                                <span class="font-bold text-white"><i class="fa-solid fa-life-ring text-emerald-400 mr-2"></i> Explanation & Remediation</span>

                            </button>

                                <p class="mb-3"><strong class="text-emerald-300">Why "Question the Obvious"?</strong></p>
                                <p class="mb-4">Imagine spending 30 minutes taking apart a computer to fix a broken hard drive, only to realize the computer was simply unplugged. Questioning the obvious saves hours of wasted effort.</p>
                                <p class="mb-3"><strong class="text-emerald-300">The Danger of Multiple Tests</strong></p>
                                <p>If you test three different fixes at the exact same time and the computer starts working, you won't know <em>which</em> fix actually solved the problem. Always change <strong>one variable at a time</strong>.</p>
                            </div>
                        </div>

                        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-md">
                            <button onclick="toggleTile('ex-1.4.1')" class="w-full flex justify-between items-center p-4 bg-slate-700/50 hover:bg-slate-700 transition-colors text-left focus:outline-none">
                                <span class="font-bold text-white"><i class="fa-solid fa-lightbulb text-emerald-400 mr-2"></i> Concept Example</span>
                                <i id="ex-1.4.1-icon" class="fa-solid fa-chevron-down text-slate-400 transition-transform"></i>
                            </button>
                            <div id="ex-1.4.1" class="hidden p-5 border-t border-slate-700 bg-slate-900 text-sm text-slate-300 leading-relaxed">
                                <p class="mb-3"><strong class="text-emerald-300">Scenario: A user complains they cannot print a document.</strong></p>
                                <ul class="list-decimal list-inside space-y-2 ml-2">
                                    <li><strong>Identify:</strong> Ask the user which printer they are trying to use. Try to print a test page yourself to replicate the error.</li>
                                    <li><strong>Theory:</strong> Question the obvious: Is the printer out of paper? Is it turned on? Is it connected to the network?</li>
                                    <li><strong>Test:</strong> Walk over and check the paper tray. It's full. Check the power light. It's on. Check the network cable. It's loose!</li>

                                    <li><strong>Verify:</strong> Print the test page again. It prints successfully! Ensure the cable route prevents people from tripping over it (Preventive Measure).</li>

                                </ul>
                            </div>
                        </div>
                    </div>

                        </div>
                    </div>
                `,

                            <p class="text-slate-300 mb-4">Octal uses digits <strong>0 through 7</strong>. In computing, its most practical modern use is setting file permissions in Linux/UNIX systems.</p>
                            <div class="grid md:grid-cols-2 gap-4">
                                <div class="bg-slate-900 p-4 rounded-lg border-l-4 border-cyan-500">
                                    <h3 class="font-bold text-white mb-2">The chmod Command</h3>
                                    <p class="text-sm text-slate-400">Permissions are grouped into three categories: <strong>Owner, Group, Others</strong>.</p>
                                    <ul class="text-sm text-slate-400 mt-2 list-none space-y-1">

                                        <li><strong>777:</strong> Everyone can read, write, execute. (Dangerous!)</li>

            outputDiv.scrollTop = outputDiv.scrollHeight;
            
            if(document.getElementById('obj1-status').innerText.includes("Obj 1") && 
               document.getElementById('obj2-status').innerText.includes("Obj 2") &&
               document.getElementById('obj1-status').classList.contains('text-emerald-400') &&
               document.getElementById('obj2-status').classList.contains('text-emerald-400')) {
                setTimeout(() => showModal("System Secured", "You successfully used octal numbers to configure Linux file permissions!", "success"), 500);
            }
        }

        // 4.1.1 Programming Languages
        function checkLanguageMatch() {
            const l1 = document.getElementById('lang-1').value;
            const l2 = document.getElementById('lang-2').value;
            const l3 = document.getElementById('lang-3').value;
            const l4 = document.getElementById('lang-4').value;
            if(!l1 || !l2 || !l3 || !l4) return showModal("Incomplete", "Please classify all scenarios.");
            
            if(l1 === 'assembly' && l2 === 'interpreted' && l3 === 'compiled' && l4 === 'query') {
                showModal("Success!", "You correctly assigned the best language paradigms to the tasks!", "success");
            } else {
                showModal("Error", "Check your matches. Robots need low-level Assembly. Cross-platform apps use Interpreted. High-performance games need Compiled. Databases use Query.", "error");
            }
        }

        // 4.2.1 Data Types
        function checkDataTypes() {
            const d1 = document.getElementById('dt-1').value;
            const d2 = document.getElementById('dt-2').value;
            const d3 = document.getElementById('dt-3').value;
            const d4 = document.getElementById('dt-4').value;
            if(d1 === 'string' && d2 === 'int' && d3 === 'float' && d4 === 'bool') {
                showModal("Success!", "All data types identified correctly!", "success");
            } else {
                showModal("Error", "Some data types are incorrect. Remember: floats have decimals, strings have quotes.", "error");
            }
        }

        // 4.3.1 Identifiers
        function checkIdentifiers() {
            const v = document.getElementById('id-var').value.trim();
            const c = document.getElementById('id-const').value.trim();
            if(!v || !c) return showModal("Incomplete", "Provide a new identifier for both the variable and the constant.");
            
            if(v.length > 2 && c === c.toUpperCase() && c.length > 3) {
                showModal("Clean Code!", "Excellent! You replaced the messy identifiers and magic numbers with descriptive names and constants.", "success");
            } else {
                showModal("Review Rules", "Ensure the variable name is descriptive (more than 2 letters) and the CONSTANT is ALL CAPS.", "error");
            }
        }

        // 4.3.2 Arrays - Boat Grid
        let boatGridState = Array(5).fill().map(() => Array(5).fill('.'));
        const targetBoatGrid = [
            ['.', 'X', '.', 'X', '.'],
            ['.', 'X', '.', 'X', '.'],
            ['.', 'X', '.', 'X', '.'],
            ['X', 'X', 'X', 'X', 'X'],
            ['.', 'X', 'X', 'X', '.']
        ];

        function initActivity432() {
            boatGridState = Array(5).fill().map(() => Array(5).fill('.'));
            const gridEl = document.getElementById('boat-grid');
            if(!gridEl) return;
            gridEl.innerHTML = '';
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const cell = document.createElement('div');
                    cell.className = `w-8 h-8 border flex items-center justify-center font-mono font-bold cursor-pointer transition-colors select-none bg-slate-800 border-slate-600 text-slate-500 hover:bg-slate-700`;
                    cell.innerText = '.';
                    cell.onclick = () => toggleBoatCell(cell, r, c);
                    gridEl.appendChild(cell);
                }
            }
        }

        function toggleBoatCell(cell, r, c) {
            if(boatGridState[r][c] === '.') {
                boatGridState[r][c] = 'X';
                cell.innerText = 'X';
                cell.className = `w-8 h-8 border flex items-center justify-center font-mono font-bold cursor-pointer transition-colors select-none bg-teal-900/50 border-teal-500 text-teal-400`;
            } else {
                boatGridState[r][c] = '.';
                cell.innerText = '.';
                cell.className = `w-8 h-8 border flex items-center justify-center font-mono font-bold cursor-pointer transition-colors select-none bg-slate-800 border-slate-600 text-slate-500 hover:bg-slate-700`;
            }
        }

        function checkBoatGrid() {
            let correct = true;
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (boatGridState[r][c] !== targetBoatGrid[r][c]) { correct = false; break; }
                }
            }
            if (correct) showModal("Compiled Successfully!", "Great job! You successfully manipulated the 2D array elements to draw the boat shape.", "success");
            else showModal("Syntax Error", "The boat array doesn't match the target shape. Review your row and column indexes.", "error");
        }

        // 4.3.3 Functions - Factory
        let currentSelectedOperator = null;
        let functionSlots = { 'add': null, 'subtract': null, 'multiply': null, 'divide': null };

        function initActivity433() {
            currentSelectedOperator = null;
            functionSlots = { 'add': null, 'subtract': null, 'multiply': null, 'divide': null };
            const opDisplay = document.getElementById('selected-op-display');
            if(opDisplay) opDisplay.innerText = "Select an operator...";
            updateFunctionSlotsUI();
        }

        function selectOperator(op) {
            currentSelectedOperator = op;
            document.getElementById('selected-op-display').innerHTML = `Currently holding: <span class="text-fuchsia-400 text-xl mx-2 bg-slate-800 px-2 rounded border border-slate-500">${op}</span>`;
        }

        function placeOperator(funcName) {
            if (!currentSelectedOperator) return;
            functionSlots[funcName] = currentSelectedOperator;
            currentSelectedOperator = null;
            document.getElementById('selected-op-display').innerText = "Select next operator...";
            updateFunctionSlotsUI();
        }

        function updateFunctionSlotsUI() {
            for (const [func, op] of Object.entries(functionSlots)) {
                const el = document.getElementById(`slot-${func}`);
                if (!el) continue;
                if (op) {
                    el.innerText = op;
                    el.classList.remove('border-dashed', 'border-slate-500');
                    el.classList.add('border-solid', 'border-fuchsia-500', 'bg-fuchsia-900/30');
                } else {
                    el.innerText = '';
                    el.classList.add('border-dashed', 'border-slate-500');
                    el.classList.remove('border-solid', 'border-fuchsia-500', 'bg-fuchsia-900/30');
                }
            }
        }

        function checkFunctionFactory() {
            const correctMappings = { 'add': '+', 'subtract': '-', 'multiply': '*', 'divide': '/' };
            let complete = true, correct = true;
            for (const [func, op] of Object.entries(functionSlots)) {
                if (!op) complete = false;
                if (op !== correctMappings[func]) correct = false;
            }
            if (!complete) return showModal("Incomplete Factory", "Please place an operator in every function slot before testing.");
            if (correct) showModal("Calculations Correct!", "Perfect! You successfully configured each helper function to perform its specific task.", "success");
            else showModal("Calculation Error", "Some functions are returning the wrong values. Double-check your operator assignments.", "error");
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function dragEnter(ev) {
            ev.preventDefault();
            if(ev.target.classList.contains('dropzone')) ev.target.classList.add('dragover');
        }
        function dragLeave(ev) {
            if(ev.target.classList.contains('dropzone')) ev.target.classList.remove('dragover');
        }
        function drop(ev, zoneId) {
            ev.preventDefault();
            if(ev.target.classList.contains('dropzone')) ev.target.classList.remove('dragover');
            let dropTarget = ev.target;
            while(dropTarget && !dropTarget.classList.contains('dropzone')) {
                dropTarget = dropTarget.parentNode;
            }
            if(dropTarget) {
                var data = ev.dataTransfer.getData("text");
                dropTarget.appendChild(document.getElementById(data));
            }
        }

        // 4.3.4 Objects - Mapping
        const objectTerms = [
            { id: 'obj-t1', text: 'batteryLevel', type: 'prop' },
            { id: 'obj-t2', text: 'installApp()', type: 'meth' },
            { id: 'obj-t3', text: 'color', type: 'prop' },
            { id: 'obj-t4', text: 'takePhoto()', type: 'meth' },
            { id: 'obj-t5', text: 'brand', type: 'prop' },
            { id: 'obj-t6', text: 'makeCall()', type: 'meth' }
        ];

        function initActivity434() {
            const container = document.getElementById('terms-container');
            const propsZone = document.getElementById('drop-properties');
            const methsZone = document.getElementById('drop-methods');
            if(!container) return;
            
            propsZone.innerHTML = '<h3 class="font-bold text-white mb-2 text-center border-b border-slate-700 pb-2"><i class="fa-solid fa-list-ul text-orange-400 mr-2"></i>Properties (State)</h3>';
            methsZone.innerHTML = '<h3 class="font-bold text-white mb-2 text-center border-b border-slate-700 pb-2"><i class="fa-solid fa-person-running text-orange-400 mr-2"></i>Methods (Behaviors)</h3>';
            container.innerHTML = '';

            [...objectTerms].sort(() => Math.random() - 0.5).forEach(term => {
                const el = document.createElement('div');
                el.id = term.id;
                el.className = 'draggable bg-slate-700 border border-slate-500 rounded px-3 py-1 font-mono text-sm text-white hover:bg-slate-600 inline-block';
                el.draggable = true;
                el.ondragstart = drag;
                el.innerText = term.text;
                el.dataset.type = term.type;
                container.appendChild(el);
            });
        }

        function checkObjectMapping() {
            const propsZone = document.getElementById('drop-properties');
            const methsZone = document.getElementById('drop-methods');
            const container = document.getElementById('terms-container');
            
            if(container.children.length > 0) return showModal("Incomplete", "Please drag all terms into either Properties or Methods.");

            let correct = true;
            Array.from(propsZone.children).forEach(el => {
                if(el.tagName !== 'H3' && el.dataset.type !== 'prop') correct = false;
            });
            Array.from(methsZone.children).forEach(el => {
                if(el.tagName !== 'H3' && el.dataset.type !== 'meth') correct = false;
            });

            if(correct) showModal("Perfect Blueprint!", "You correctly separated the Smart Phone's state (nouns) from its behaviors (verbs).", "success");
            else showModal("Review Blueprint", "Some terms are misplaced. Remember: Properties are characteristics (nouns), Methods are actions (verbs/functions ending in () ).", "error");
        }

        // 4.4.1 Organization - Sequencing
        const pseudoBlocks = [
            { id: 'ps-1', text: 'ASK user to input age' },
            { id: 'ps-2', text: 'IF age < 13 THEN' },
            { id: 'ps-3', text: '&nbsp;&nbsp;DISPLAY "Rating: G"' },
            { id: 'ps-4', text: 'ELSE IF age < 17 THEN' },
            { id: 'ps-5', text: '&nbsp;&nbsp;DISPLAY "Rating: PG"' },
            { id: 'ps-6', text: 'ELSE' },
            { id: 'ps-7', text: '&nbsp;&nbsp;DISPLAY "Rating: R"' }
        ];

        function initActivity441() {
            const source = document.getElementById('pseudo-source');
            const target = document.getElementById('pseudo-target');
            if(!source) return;

            source.innerHTML = '';
            target.innerHTML = '';

            [...pseudoBlocks].sort(() => Math.random() - 0.5).forEach(block => {
                const el = document.createElement('div');
                el.id = block.id;
                el.className = 'draggable bg-slate-800 border border-slate-500 rounded p-2 font-mono text-sm text-yellow-300 hover:bg-slate-700 block w-full text-left';
                el.draggable = true;
                el.ondragstart = drag;
                el.innerHTML = block.text;
                source.appendChild(el);
            });
        }

        function checkPseudocodeSequence() {
            const target = document.getElementById('pseudo-target');
            if(target.children.length !== pseudoBlocks.length) return showModal("Incomplete", "Drag all blocks to the Program Sequence side to complete the logic flow.");

            let correct = true;
            Array.from(target.children).forEach((el, index) => {
                if(el.id !== pseudoBlocks[index].id) correct = false;
            });

            if(correct) showModal("Logic Compiled!", "Excellent! You successfully translated the flowchart concept into structured pseudocode.", "success");
            else showModal("Logic Error", "The sequence is incorrect. Ensure you follow the IF -> ELSE IF -> ELSE logical flow properly.", "error");
        }

        let currentQuizQuestions = [];

        function renderQuizEngine() {
            const container = document.getElementById('content-container');
            currentQuizQuestions = moduleData[currentModule].quiz;
            
            let html = `
                <div class="animate-fade-in max-w-3xl mx-auto pb-10">
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 mb-6 shadow-md">
                        <h2 class="text-2xl font-bold text-emerald-400 mb-2">Module Quiz</h2>
                        <p class="text-slate-300">Answer the following 20 questions. You must score 90% (18/20) or higher to earn the Certificate of Mastery.</p>
                    </div>
                    <div class="space-y-6">
            `;

            currentQuizQuestions.forEach((q, index) => {
                html += `
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-sm">
                        <h3 class="font-bold text-white mb-4"><span class="text-emerald-500 mr-2">${index + 1}.</span> ${q.q}</h3>
                        <div class="space-y-2">
                `;
                q.o.forEach((opt, optIndex) => {
                    html += `
                        <label class="flex items-center p-3 bg-slate-900 rounded-lg border border-slate-600 cursor-pointer hover:bg-slate-700 transition-colors">
                            <input type="radio" name="q${index}" value="${optIndex}" class="form-radio text-emerald-500 h-4 w-4 bg-slate-800 border-slate-500 focus:ring-emerald-500 focus:ring-offset-slate-900">
                            <span class="ml-3 text-slate-300 text-sm">${opt}</span>
                        </label>
                    `;
                });
                html += `</div></div>`;
            });

            html += `
                    <button onclick="submitQuiz()" class="cyber-button w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-xl shadow-lg mt-8 text-lg">
                        Submit Quiz
                    </button>
                </div>
            `;
            
            container.innerHTML = html;
        }

        function submitQuiz() {
            let score = 0;
            let total = currentQuizQuestions.length;
            
            for (let i = 0; i < total; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (selected && parseInt(selected.value) === currentQuizQuestions[i].a) {
                    score++;
                }
            }
            
            const percentage = (score / total) * 100;
            
            if (score > userScores[currentModule].maxScore) {
                userScores[currentModule].maxScore = score;
            }
            
            if (percentage >= 90) {
                userScores[currentModule].passed = true;
                showModal("Passed!", `You scored ${score}/${total} (${percentage}%). You have mastered this module! The Certificate tab is now unlocked.`, "success");
                document.getElementById('tab-cert').classList.remove('hidden');
            } else {
                showModal("Keep Trying", `You scored ${score}/${total} (${percentage}%). You need 90% to pass. Review the Learn tab and try again.`, "error");
            }
            
            updateProgress();
            window.scrollTo(0,0);
        }

        function renderCertificate() {
            const container = document.getElementById('content-container');
            const modTitle = moduleData[currentModule].title;
            const date = new Date().toLocaleDateString();
            
            container.innerHTML = `
                <div class="animate-fade-in h-full flex flex-col items-center justify-center">
                    <div id="certificate-frame" class="bg-white p-8 md:p-12 rounded-lg shadow-2xl max-w-4xl w-full text-center relative border-[12px] border-emerald-900/10">
                        <div class="absolute top-4 left-4 w-16 h-16 border-t-4 border-l-4 border-emerald-600"></div>
                        <div class="absolute top-4 right-4 w-16 h-16 border-t-4 border-r-4 border-emerald-600"></div>
                        <div class="absolute bottom-4 left-4 w-16 h-16 border-b-4 border-l-4 border-emerald-600"></div>
                        <div class="absolute bottom-4 right-4 w-16 h-16 border-b-4 border-r-4 border-emerald-600"></div>
                        
                        <div class="text-emerald-700 text-6xl mb-6"><i class="fa-solid fa-award"></i></div>
                        <h1 class="text-4xl md:text-5xl font-bold text-slate-800 mb-2 uppercase tracking-widest" style="font-family: 'Times New Roman', serif;">Certificate of Mastery</h1>
                        <p class="text-lg text-slate-500 mb-8 uppercase tracking-widest">Dual-Enrollment Cybersecurity I</p>
                        
                        <p class="text-xl text-slate-600 mb-2">This certifies that</p>
                        <h2 class="text-3xl font-bold text-emerald-800 border-b-2 border-emerald-300 inline-block px-10 pb-2 mb-8">TCAT Student</h2>
                        
                        <p class="text-xl text-slate-600 mb-2">has successfully completed the module</p>
                        <h3 class="text-2xl font-bold text-slate-800 mb-8">${modTitle}</h3>
                        
                        <div class="flex justify-between items-end mt-12 px-10">
                            <div class="text-left">
                                <p class="border-b border-slate-400 w-32 pb-1 text-slate-800 font-bold">${date}</p>
                                <p class="text-sm text-slate-500 mt-1 uppercase">Date</p>
                            </div>
                            <div class="text-right">
                                <p class="border-b border-slate-400 w-48 pb-1 text-emerald-800 font-bold" style="font-family: 'Brush Script MT', cursive; font-size: 1.5rem;">CYBER.ORG Tech+</p>
                                <p class="text-sm text-slate-500 mt-1 uppercase">Curriculum</p>
                            </div>
                        </div>
                    </div>
                    <button onclick="printCertificate()" class="mt-8 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-print"></i> Print / Save PDF
                    </button>
                </div>
            `;
        }

        function printCertificate() {
            window.print();
        }

        window.onload = () => {
            switchModule('1.4.1');
        };
    </script>
